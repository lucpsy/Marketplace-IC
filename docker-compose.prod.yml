services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: marketplace-backend-prod
    restart: always
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (min 32 chars) no .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Defina CORS_ORIGIN no .env}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORP_POLICY: ${CORP_POLICY:-same-site}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@diacom.ic.ufal.br}
      ADMIN_NOME: ${ADMIN_NOME:-Coordenação DIACOM}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Defina NEXT_PUBLIC_API_URL no .env}
    container_name: marketplace-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_prod_data:
