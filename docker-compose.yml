services:
  postgres:
    image: postgres:16
    container_name: marketplace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Original. Documentei pq estou usando o fakeapi para simular a API.
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile

  #   container_name: marketplace-backend
  #   restart: unless-stopped

  #   ports:
  #     - "3001:3000"

  #   environment:
  #     DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace

  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules

  #   command: npm run start:dev

  #   depends_on:
  #     - postgres

  # Backend Fake API. Apague isso no futuro.
  backend:
    image: node:20-alpine
    working_dir: /app
    container_name: marketplace-fake-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./fake-api:/app
      - /app/node_modules
    command: sh -c "npm install && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: marketplace-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    command: npm run dev

    depends_on:
      - backend

volumes:
  postgres_data:
